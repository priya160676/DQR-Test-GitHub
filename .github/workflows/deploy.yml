name: .NET Release + Log

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed
  repository_dispatch:
    types: [trigger-release]

permissions:
  contents: write
  actions: write
  
jobs:
  release:
    # if: >
    #   github.event_name == 'repository_dispatch' ||
    #   (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    
 
      if: ${{ github.event_name == 'repository_dispatch' ||
              (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
              github.event_name == 'workflow_dispatch' }}


      runs-on: ubuntu-latest

      steps:
        - name: Get artifact download URL
          run: |
            echo "Triggered by workflow run ID: ${{ github.event.workflow_run.id }}"
  
        - name: Download artifact from triggering workflow
          uses: dawidd6/action-download-artifact@v2
          with:
            workflow: ${{ github.event.workflow_run.workflow_id }}
            run_id: ${{ github.event.workflow_run.id }}
            name: build-artifact
            path: ./artifact
  
        - name: List downloaded files
          run: ls -R ./artifact
  
        - name: Azure Login
          uses: azure/login@v1
          with:
            creds: ${{ secrets.AZURE_CREDENTIALS }}
  
        - name: Deploy to Azure Web App
          uses: azure/webapps-deploy@v2
          with:
            app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
            package: ./artifact
  
        - name: Checkout repo
          uses: actions/checkout@v4
  
        - name: Clone repo for updating deployment log
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@github.com"
            git clone --single-branch --branch DevOps https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }} repo
  
        - name: Generate & Append deployment log
          if: always()
          run: |
            cd repo
            mkdir -p .github/data
            LOG_FILE=".github/data/deployments.json"
  
            if [ ! -f "$LOG_FILE" ]; then echo "[]" > "$LOG_FILE"; fi
  
            cat > new_entry.json <<EOF
            {
              "deployment_id": "${{ github.run_id }}",
              "repo": "${{ github.repository }}",
              "status": "${{ job.status }}",
              "rollback": false,
              "timestamp": "${{ github.run_started_at }}",
              "date": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            }
            EOF
  
            jq --argjson new_entry "$(cat new_entry.json)" '. += [$new_entry]' "$LOG_FILE" > tmp.json && mv tmp.json "$LOG_FILE"
  
        - name: Commit deployment log to repo
          if: always()
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            cd repo
            git add .github/data/deployments.json
            git commit -m "Update deployment log: ${{ github.run_id }}" || echo "Nothing to commit"
            git pull --rebase origin DevOps || true
            git push origin HEAD:DevOps
